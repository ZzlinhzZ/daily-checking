<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lịch Đánh Dấu Theo Màu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      font-family: sans-serif;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }

    .weekday {
      background-color: #eaeaea;
      text-align: center;
      padding: 10px 0;
      font-weight: bold;
      border: 1px solid #ccc;
    }

    .box {
      border: 1px solid #ccc;
      position: relative;
      cursor: pointer;
      text-align: center;
      padding-top: 20px;
      box-sizing: border-box;
    }

    .day-number {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none; /* Ẩn theo mặc định */
    }
    
    /* Hiển thị vòng tròn khi ô được đánh dấu 'completed' */
    .completed .circle {
      display: block;
    }
    
    /* Các lớp màu cho vòng tròn */
    .circle-red { background-color: red; }
    .circle-green { background-color: #28a745; } /* green */
    .circle-yellow { background-color: #ffc107; } /* yellow */


    .today {
      background-color: #fff5c2;
      border: 2px solid #ffb300;
    }
    
    /* === CSS CHO CÁC THẺ CHỌN MÀU === */
    .color-palette {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .color-note {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        cursor: pointer;
        border: 3px solid transparent;
        transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .color-note:hover {
        transform: scale(1.1);
    }

    .color-note.active {
        border-color: #333;
        transform: scale(1.15);
    }

    .color-note.red { background-color: red; }
    .color-note.green { background-color: #28a745; }
    .color-note.yellow { background-color: #ffc107; }

  </style>
</head>
<body>
  <div class="calendar" id="calendar"></div>

  <div class="color-palette">
    <div class="color-note red active" data-color="red"></div>
    <div class="color-note green" data-color="green"></div>
    <div class="color-note yellow" data-color="yellow"></div>
  </div>


  <script>
    const calendar = document.getElementById('calendar');
    const today = new Date();
    const currentDay = today.getDate();
    const currentMonth = today.getMonth() + 1;
    const currentYear = today.getFullYear();

    // === BIẾN MỚI CHO VIỆC CHỌN MÀU ===
    let selectedColor = 'red'; // Mặc định là màu đỏ
    const colorNotes = document.querySelectorAll('.color-note');

    // Số ngày trong tháng hiện tại
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
    // Lấy thứ của ngày 1 trong tháng
    const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
    // Mảng tên thứ
    const weekdayNames = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];

    // === CẬP NHẬT CẤU TRÚC LƯU TRỮ ===
    // Thay vì một mảng, chúng ta dùng một đối tượng để lưu ngày và màu sắc tương ứng
    // Ví dụ: { "1": "red", "5": "green" }
    let markedDays = JSON.parse(localStorage.getItem('markedDays')) || {};

    // === HÀNG THỨ ===
    weekdayNames.forEach(name => {
      const w = document.createElement('div');
      w.className = 'weekday';
      w.textContent = name;
      calendar.appendChild(w);
    });

    // === TẠO CÁC Ô TRỐNG TRƯỚC NGÀY 1 ===
    for (let i = 0; i < firstDay; i++) {
      const emptyBox = document.createElement('div');
      emptyBox.className = 'box';
      calendar.appendChild(emptyBox);
    }

    // === TẠO CÁC Ô NGÀY (ĐÃ CẬP NHẬT LOGIC) ===
    for (let day = 1; day <= daysInMonth; day++) {
      const box = document.createElement('div');
      box.className = 'box';
      box.dataset.day = day;

      // Tạo sẵn vòng tròn nhưng chưa có màu
      box.innerHTML = `
        <div class="day-number">${day}</div>
        <div class="circle"></div>
      `;
      
      const circle = box.querySelector('.circle');

      // Kiểm tra xem ngày này đã được đánh dấu chưa
      if (markedDays[day]) {
        box.classList.add('completed');
        const color = markedDays[day]; // Lấy màu đã lưu
        circle.classList.add(`circle-${color}`); // Thêm lớp màu tương ứng
      }

      if (day === currentDay) {
        box.classList.add('today');
      }

      // === CẬP NHẬT LOGIC KHI CLICK VÀO MỘT NGÀY ===
      box.addEventListener('click', () => {
        const dayIndex = day;
        
        // Nếu ngày đã được đánh dấu -> xóa đánh dấu
        if (markedDays[dayIndex]) {
            box.classList.remove('completed');
            // Xóa lớp màu cũ khỏi vòng tròn
            circle.className = 'circle'; 
            delete markedDays[dayIndex];
        } 
        // Nếu ngày chưa được đánh dấu -> đánh dấu bằng màu đã chọn
        else {
            box.classList.add('completed');
            // Thêm lớp màu đang được chọn
            circle.classList.add(`circle-${selectedColor}`);
            markedDays[dayIndex] = selectedColor;
        }

        // Lưu lại trạng thái mới vào localStorage
        localStorage.setItem('markedDays', JSON.stringify(markedDays));
      });

      calendar.appendChild(box);
    }
    
    // === LOGIC MỚI ĐỂ XỬ LÝ CHỌN MÀU ===
    colorNotes.forEach(note => {
        note.addEventListener('click', () => {
            // Bỏ lớp 'active' khỏi tất cả các thẻ màu
            colorNotes.forEach(n => n.classList.remove('active'));
            // Thêm lớp 'active' cho thẻ màu vừa được click
            note.classList.add('active');
            // Cập nhật biến màu đã chọn
            selectedColor = note.dataset.color;
        });
    });

  </script>
</body>
</html>
