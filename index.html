<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lịch 30 Ô Đánh Dấu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      font-family: sans-serif;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }

    .weekday {
      background-color: #eaeaea;
      text-align: center;
      padding: 10px 0;
      font-weight: bold;
      border: 1px solid #ccc;
    }

    .box {
      border: 1px solid #ccc;
      position: relative;
      cursor: pointer;
      text-align: center;
      padding-top: 20px;
      box-sizing: border-box;
    }

    .day-number {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: red;
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
    }

    .completed .circle {
      display: block;
    }

    .today {
      background-color: #fff5c2;
      border: 2px solid #ffb300;
    }
  </style>
</head>
<body>
  <div class="calendar" id="calendar"></div>

  <script>
    const calendar = document.getElementById('calendar');
    const today = new Date();
    const currentDay = today.getDate();
    const currentMonth = today.getMonth() + 1;
    const currentYear = today.getFullYear();

    // Số ngày trong tháng hiện tại
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

    // Lấy thứ của ngày 1 trong tháng
    const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();

    // Mảng tên thứ
    const weekdayNames = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];

    // Lấy trạng thái đã lưu
    let completedBoxes = JSON.parse(localStorage.getItem('completedBoxes')) || [];

    // === HÀNG THỨ ===
    weekdayNames.forEach(name => {
      const w = document.createElement('div');
      w.className = 'weekday';
      w.textContent = name;
      calendar.appendChild(w);
    });

    // === TẠO CÁC Ô TRỐNG TRƯỚC NGÀY 1 (nếu cần) ===
    for (let i = 0; i < firstDay; i++) {
      const emptyBox = document.createElement('div');
      emptyBox.className = 'box';
      calendar.appendChild(emptyBox);
    }

    // === TẠO CÁC Ô NGÀY ===
    for (let day = 1; day <= daysInMonth && day <= 31; day++) {
      const box = document.createElement('div');
      box.className = 'box';
      box.dataset.index = day;

      if (completedBoxes.includes(day)) {
        box.classList.add('completed');
      }

      if (day === currentDay) {
        box.classList.add('today');
      }

      box.innerHTML = `
        <div class="day-number">${day}</div>
        <div class="circle"></div>
      `;

      box.addEventListener('click', () => {
        box.classList.toggle('completed');
        const index = day;

        if (box.classList.contains('completed')) {
          if (!completedBoxes.includes(index)) {
            completedBoxes.push(index);
          }
        } else {
          completedBoxes = completedBoxes.filter(item => item !== index);
        }

        localStorage.setItem('completedBoxes', JSON.stringify(completedBoxes));
      });

      calendar.appendChild(box);
    }
  </script>
</body>
</html>
